# Weekly check that the Academy still matches the live AI-901 skills measured.
# When the study guide changes, this opens (or updates) one issue labelled
# "objective-drift" with the differences. It never edits content: a person
# reviews the change and updates the Academy deliberately (CONTRIBUTING.md).
# Note: GitHub pauses scheduled workflows after 60 days without repository activity;
# re-enable it from the Actions tab if that happens.
name: Objective freshness

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare objectives with the live study guide
        id: check
        run: |
          set +e
          node tools/check-objectives.mjs --report drift.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create objective-drift --color D93F0B --description "AI-901 skills measured changed" --force
          n=$(gh issue list --label objective-drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file drift.md
          else
            gh issue create --title "AI-901 skills measured changed: review needed" --label objective-drift --body-file drift.md
          fi

      - name: Flag a page that could not be read
        if: steps.check.outputs.code == '2'
        run: |
          echo "::warning::The AI-901 study guide could not be read or parsed. Check it by hand: https://learn.microsoft.com/credentials/certifications/resources/study-guides/ai-901"
          exit 1
