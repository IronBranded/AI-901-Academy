  <span class="topbar__title"><a href="#/dash">AI-901 Academy</a></span>
  <nav class="topbar__nav" aria-label="Main">
    <button class="viewbtn" type="button" data-go="dash" aria-pressed="false">Dashboard</button>
    <button class="viewbtn" type="button" data-go="f" aria-pressed="false">Foundations</button>

</div>
